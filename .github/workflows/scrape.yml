name: Daily Gold Price Scraper

on:
  schedule:
    # මේක හැමදාම ලංකාවේ වෙලාවෙන් උදේ 9:30 ට run වෙනවා (UTC 4:00)
    - cron: '0 4 * * *' 
  workflow_dispatch: # අපිට ඕන වෙලාවක manual run කරන්නත් මේකෙන් පුළුවන්

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          # අලුත් වෙනසක් තියෙනවා නම් විතරක් commit කරනවා
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update: Gold price for today"
          git push
