name: Daily Gold Price Scraper

on:
  schedule:
    - cron: '0 4,8,16 * * *'  # දවසට 3 පාරක් (9:30 AM, 1:30 PM, 9:30 PM)
  workflow_dispatch:          # අතින් Run කිරීමට ඇති හැකියාව

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

     - name: Run Scraper
        run: python scraper.py

      - name: Run Analyzer
        run: python analyzer.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add data.json analysis.json
          git commit -m "Update prices and analysis"
          git push
