name: Daily Gold Price Scraper

on:
  schedule:
    - cron: '0 4,8,16 * * *'  # දවසට 3 පාරක් (9:30 AM, 1:30 PM, 9:30 PM)
  workflow_dispatch:          # අතින් Run කිරීමට ඇති හැකියාව

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          # අලුත් වෙනසක් තියෙනවා නම් විතරක් commit කරනවා
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update: Gold price for today"
          git push
