name: Daily Gold Price Scraper and Analyzer

on:
  schedule:
    # ලංකාවේ වෙලාවෙන් උදේ 9:30, දවල් 1:30 සහ රෑ 9:30 ට (UTC 4, 8, 16)
    - cron: '0 4,8,16 * * *'
  workflow_dispatch: # ඕනෑම වෙලාවක අතින් (Manual) run කිරීමට

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Gold Scraper
        run: python scraper.py

      - name: Run AI Analyzer
        run: python analyzer.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json analysis.json
          # වෙනසක් තිබේ නම් පමණක් commit කරන්න (error වැළැක්වීමට)
          git diff --quiet && git diff --staged --quiet || git commit -m "Update gold prices and AI analysis [skip ci]"
          git push
